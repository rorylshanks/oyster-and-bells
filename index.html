<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oyster &amp; Bells</title>
<meta name="description" content="A cosy live departures board for any two London Underground stations.">
<meta name="theme-color" content="#a9e2c5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap">
<style>
  :root {
    --grass: #a9e2c5;
    --grass-light: #b9eacf;
    --grass-shadow: #7fc8a5;
    --cream: #fff9e8;
    --blush: #ffe8f0;
    --pink: #ffbdd3;
    --hot-pink: #f4628f;
    --cocoa: #5a3d2b;
    --latte: #86654f;
    --rule: #f0e2c6;
    --alert: #c2255c;
  }

  /* Every size below is in rem, and 1rem tracks the screen, so the board fills
     the tablet whether it's in the browser (shorter) or fullscreen (taller). */
  html { font-size: min(1vw, 1.8vh); }
  @media (orientation: portrait) { html { font-size: min(1.9vw, 1vh); } }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    padding: 1rem;
    overflow: hidden;
    background-color: var(--grass);
    background-image:
      linear-gradient(45deg, var(--grass-light) 25%, transparent 25% 75%, var(--grass-light) 75%),
      linear-gradient(45deg, var(--grass-light) 25%, transparent 25% 75%, var(--grass-light) 75%);
    background-size: 5rem 5rem;
    background-position: 0 0, 2.5rem 2.5rem;
    color: var(--cocoa);
    font-family: Fredoka, "Trebuchet MS", sans-serif;
    font-weight: 500;
    -webkit-user-select: none;
    user-select: none;
  }

  main {
    flex: 1;
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(0, 1fr);
    gap: 1rem;
    min-height: 0;
  }
  @media (orientation: portrait) { main { grid-auto-flow: row; grid-auto-rows: minmax(0, 1fr); } }

  .choosing main,
  .choosing footer { display: none; }

  .station,
  .setup,
  footer,
  .notice {
    background: var(--cream);
    border: .25rem solid #fff;
    box-shadow: 0 .35rem 0 var(--grass-shadow);
  }

  .station {
    display: grid;
    grid-template-rows: auto;
    grid-auto-rows: minmax(0, 1fr);
    min-height: 0;
    margin-bottom: .35rem;
    border-radius: 2rem;
    overflow: hidden;
  }

  .station h2 {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: .5rem 1.6rem .3rem;
    background: var(--pink);
    font-size: 3.1rem;
    font-weight: 600;
    line-height: 1.1;
  }
  /* The scalloped edge along the bottom of the header. */
  .station h2::after {
    content: "";
    position: absolute;
    inset: 100% 0 auto;
    height: .7rem;
    background: radial-gradient(circle at 50% 0, var(--pink) .7rem, transparent .72rem) 0 0 / 1.4rem .7rem repeat-x;
  }

  .name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .trim { display: flex; flex: none; align-items: center; gap: .6rem; }
  .sparkle { width: 1.5rem; height: 1.5rem; fill: #fff; }
  .bow { width: 4.2rem; height: 2.8rem; fill: var(--hot-pink); }

  .direction {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    min-height: 0;
    padding: .5rem 1.4rem .3rem;
  }
  .station h2 + .direction { padding-top: 1.1rem; }
  .direction + .direction { border-top: .2rem dashed var(--rule); }

  .direction h3 {
    display: flex;
    justify-content: space-between;
    padding-inline: .6rem;
    font-size: 1.5rem;
    font-weight: 500;
    color: var(--latte);
  }

  .trains {
    display: grid;
    min-height: 0;
    list-style: none;
  }

  .train {
    display: grid;
    grid-template-columns: .9em minmax(0, 1fr) auto;
    align-items: center;
    column-gap: .4em;
    min-height: 0;
    padding-inline: .6rem;
    font-size: 2.5rem;
    font-weight: 600;
  }
  .train:first-child {
    font-size: 3.5rem;
    border-radius: 1.2rem;
    background: var(--blush);
  }

  .leaf {
    width: .9em;
    height: .9em;
    transform: rotate(18deg);
    fill: var(--leaf);
    stroke: var(--cocoa);
    stroke-width: 1.4;
    stroke-linejoin: round;
    stroke-linecap: round;
  }

  .dest {
    display: flex;
    align-items: baseline;
    gap: .4em;
    min-width: 0;
  }
  .place {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .via { flex: none; font-size: .6em; font-weight: 500; color: var(--latte); }

  /* Interchanges have more sections, so each one gets less height. */
  .station.compact .direction { padding-block: .3rem .2rem; }
  .station.compact h2 + .direction { padding-top: .9rem; }
  .station.compact h3 { font-size: 1.3rem; }
  .station.compact .train { font-size: 2.1rem; line-height: 1.15; }
  .station.compact .train:first-child { font-size: 2.8rem; }
  .station.compact .due { padding-block: 0; }

  .time { text-align: right; white-space: nowrap; }
  .unit { font-size: .6em; font-weight: 500; }
  .due {
    padding: .02em .5em .06em;
    border-radius: 1em;
    background: var(--hot-pink);
    color: #fff;
    animation: bounce 1.4s ease-in-out infinite;
  }
  @keyframes bounce { 50% { transform: scale(1.08); } }

  .empty {
    align-self: center;
    grid-row: 1 / -1;
    padding-inline: .6rem;
    font-size: 2rem;
    color: var(--latte);
  }

  .notice {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    align-items: center;
    gap: 1.2rem;
    padding: .5rem 1.4rem;
    border-radius: 2rem;
  }
  .notice[hidden] { display: none; }

  .tag {
    padding: .1rem 1rem .2rem;
    border-radius: 1rem;
    background: var(--hot-pink);
    color: #fff;
    font-size: 1.5rem;
    font-weight: 600;
    transform: rotate(-3deg);
  }

  #alert {
    font-size: 1.7rem;
    line-height: 1.25;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
  }

  footer {
    display: flex;
    align-items: center;
    gap: 1.6rem;
    margin-bottom: .35rem;
    padding: .35rem 1.2rem .35rem .35rem;
    border-radius: 3rem;
  }

  .clock {
    display: flex;
    align-items: baseline;
    gap: .7rem;
    padding: .1rem 1.3rem .2rem;
    border-radius: 2.5rem;
    background: var(--pink);
    white-space: nowrap;
  }
  #clock { font-size: 3rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
  #date { font-size: 1.4rem; }

  .statuses {
    display: flex;
    flex: 1;
    flex-wrap: wrap;
    gap: .1rem 1.6rem;
    min-width: 0;
    max-height: 3.8rem;
    overflow: hidden;
    list-style: none;
  }
  .status {
    display: flex;
    align-items: center;
    gap: .4rem;
    font-size: 1.4rem;
    white-space: nowrap;
  }
  .status .leaf { width: 1.5rem; height: 1.5rem; }
  .status.bad { color: var(--alert); font-weight: 600; }

  .meta { text-align: right; font-size: 1.2rem; line-height: 1.3; color: var(--latte); white-space: nowrap; }
  .meta.stale { color: var(--alert); }

  #fullscreen,
  .change {
    flex: none;
    padding: .4rem 1.1rem;
    border: 0;
    border-radius: 1.5rem;
    background: var(--blush);
    color: var(--cocoa);
    font: inherit;
    font-size: 1.3rem;
    text-decoration: none;
  }
  #fullscreen[hidden] { display: none; }

  .setup {
    flex: 1;
    min-height: 0;
    margin-bottom: .35rem;
    padding: 2rem 3rem;
    border-radius: 2rem;
    overflow-y: auto;
  }
  .setup[hidden] { display: none; }

  .setup h1 {
    display: flex;
    align-items: center;
    gap: 1rem;
    font-size: 4rem;
    font-weight: 600;
  }
  .setup > p { margin-top: .4rem; font-size: 2rem; color: var(--latte); }

  #setup-form {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 1.5rem 2rem;
    margin-top: 2rem;
  }

  .picker { display: block; font-size: 1.8rem; }
  .picker input {
    display: block;
    width: 100%;
    margin-top: .5rem;
    padding: .7rem 1.4rem;
    border: .25rem solid var(--pink);
    border-radius: 1.5rem;
    background: #fff;
    color: var(--cocoa);
    font: inherit;
    font-size: 2.4rem;
    user-select: text;
  }
  .picker input:focus { outline: none; border-color: var(--hot-pink); }
  .picker[data-id] input { background: var(--blush); }

  .results { list-style: none; margin-top: .6rem; }
  .results button {
    display: block;
    width: 100%;
    padding: .7rem 1.4rem;
    border: 0;
    border-radius: 1.2rem;
    background: none;
    color: var(--cocoa);
    font: inherit;
    font-size: 2.2rem;
    text-align: left;
  }
  .results li:nth-child(odd) button { background: var(--blush); }
  .results .hint { padding: .7rem 1.4rem; font-size: 1.8rem; color: var(--latte); }

  #open-board {
    grid-column: 1 / -1;
    justify-self: start;
    padding: .7rem 2.4rem .8rem;
    border: 0;
    border-radius: 2rem;
    background: var(--hot-pink);
    color: #fff;
    font: inherit;
    font-size: 2.4rem;
    font-weight: 600;
  }
  #open-board:disabled { background: var(--rule); color: var(--latte); }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="leaf" viewBox="0 0 24 24">
      <path d="M12 2C7 6 3 11 5 16c1.3 3.2 4 4.6 7 5 3-.4 5.700-1.800 7-5 2-5-2-10-7-14Z"/>
      <path d="M12 8v15" fill="none"/>
    </symbol>
    <symbol id="sparkle" viewBox="0 0 24 24">
      <path d="M12 0c1 8 4 11 12 12-8 1-11 4-12 12-1-8-4-11-12-12 8-1 11-4 12-12Z"/>
    </symbol>
    <symbol id="bow" viewBox="0 0 48 32">
      <path d="M24 16C17 6 7 1 3 5c-2.500 3-2.500 19 0 22 4 4 14-1 21-11Z"/>
      <path d="M24 16c7-10 17-15 21-11 2.500 3 2.500 19 0 22-4 4-14-1-21-11Z"/>
      <circle cx="24" cy="16" r="5" fill="#fff"/>
    </symbol>
  </svg>

  <section class="setup" id="setup" hidden>
    <h1>Oyster &amp; Bells <svg class="bow" aria-hidden="true"><use href="#bow"/></svg></h1>
    <p>Choose two Tube stations, then bookmark the board that opens.</p>
    <form id="setup-form" autocomplete="off">
      <div class="picker">
        <label>First station <input type="text" spellcheck="false" placeholder="Start typing…"></label>
        <ul class="results"></ul>
      </div>
      <div class="picker">
        <label>Second station <input type="text" spellcheck="false" placeholder="Start typing…"></label>
        <ul class="results"></ul>
      </div>
      <button id="open-board" type="submit" disabled>Show departures</button>
    </form>
  </section>

  <main id="board"></main>
  <div class="notice" id="notice" role="status" hidden>
    <span class="tag">Notice!</span>
    <p id="alert"></p>
  </div>
  <footer>
    <div class="clock"><time id="clock"></time><span id="date"></span></div>
    <ul class="statuses" id="statuses"></ul>
    <a class="change" href="./">Change stations</a>
    <button id="fullscreen" type="button" hidden>Fullscreen</button>
    <div class="meta" id="meta"></div>
  </footer>

<script>
  const API = 'https://api.tfl.gov.uk';
  const POLL_MS = 30_000;
  const STALE_MS = 90_000;
  const ALERT_MS = 8_000;
  const SEARCH_DELAY_MS = 250;
  // A train stays on the board this long after its arrival time, while it's at the platform.
  const AT_PLATFORM_MS = 20_000;

  const LINES = {
    bakerloo: { name: 'Bakerloo', colour: '#b36305' },
    central: { name: 'Central', colour: '#e32017' },
    circle: { name: 'Circle', colour: '#ffd300' },
    district: { name: 'District', colour: '#00782a' },
    'hammersmith-city': { name: 'H&C', colour: '#f3a9bb' },
    jubilee: { name: 'Jubilee', colour: '#a0a5a9' },
    metropolitan: { name: 'Metropolitan', colour: '#9b0056' },
    northern: { name: 'Northern', colour: '#000000' },
    piccadilly: { name: 'Piccadilly', colour: '#003688' },
    victoria: { name: 'Victoria', colour: '#0098d4' },
    'waterloo-city': { name: 'W&C', colour: '#95cdba' },
  };

  // The order sections appear in on a card, keeping opposite directions together.
  const DIRECTIONS = ['Eastbound', 'Westbound', 'Northbound', 'Southbound', 'Inner Rail', 'Outer Rail'];

  // How many trains each section has room for, by the number of sections on the card.
  const TRAINS_BY_SECTIONS = { 1: 4, 2: 4, 3: 3, 4: 2 };

  // ?stations=<id>,<id>
  const STATIONS = (new URLSearchParams(location.search).get('stations') || '')
    .split(',')
    .map(id => id.trim())
    .filter(Boolean)
    .slice(0, 2)
    .map(id => ({ id, name: '', lines: [] }));

  const state = {
    arrivals: {},   // station id -> arrivals
    updated: {},    // station id -> ms timestamp of last good response
    errors: {},     // station id -> what went wrong with the latest request
    lines: [],
  };

  const $ = id => document.getElementById(id);
  const escape = s => String(s).replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
  const clockTime = (ms, seconds = false) => new Date(ms).toLocaleTimeString('en-GB', {
    timeZone: 'Europe/London',
    hour: '2-digit',
    minute: '2-digit',
    second: seconds ? '2-digit' : undefined,
  });
  const calendarDate = ms => new Date(ms).toLocaleDateString('en-GB', {
    timeZone: 'Europe/London',
    weekday: 'short',
    day: 'numeric',
    month: 'short',
  });
  const icon = (name, attributes = '') => `<svg class="${name}" ${attributes} aria-hidden="true"><use href="#${name}"/></svg>`;
  const leaf = line => icon('leaf', `style="--leaf:${LINES[line]?.colour || '#ccc'}"`);
  const stationName = name => name.replace(/[ -]+Underground( Station)?$/, '');

  async function getJSON(path) {
    const response = await fetch(API + path, { cache: 'no-store' });
    if (!response.ok) throw Object.assign(new Error(`${path}: ${response.status}`), { status: response.status });
    return response.json();
  }

  // TfL answers for a station inside an interchange with the whole interchange,
  // so its own name and lines are among the children.
  async function loadStation(station) {
    if (station.name) return;
    const stop = await getJSON(`/StopPoint/${encodeURIComponent(station.id)}`);
    const match = stop.children?.find(child => child.naptanId === station.id) || stop;
    station.name = stationName(match.commonName);
    station.lines = (match.lines || []).map(line => line.id).filter(id => id in LINES);
  }

  async function refresh() {
    await Promise.allSettled(STATIONS.map(async station => {
      try {
        await loadStation(station);
        state.arrivals[station.id] = await getJSON(`/StopPoint/${encodeURIComponent(station.id)}/Arrivals`);
        state.updated[station.id] = Date.now();
        state.errors[station.id] = '';
      } catch (error) {
        state.errors[station.id] = error.status === 404 ? 'Station not found' : 'Can’t reach TfL';
        console.warn(error);
      }
    }));

    const lines = [...new Set(STATIONS.flatMap(station => station.lines))];
    if (lines.length) {
      await getJSON(`/Line/${lines.join(',')}/Status`)
        .then(statuses => { state.lines = statuses; })
        .catch(console.warn);
    }
    render();
  }

  const directionName = arrival => (arrival.platformName || '').match(/\w+bound|\w+ Rail/i)?.[0];

  // Most platform names carry the direction ("Eastbound - Platform 4"). Trains
  // on the ones that don't go under the direction used by others on their line
  // heading the same way.
  function directionFinder(arrivals) {
    const known = new Map();
    for (const a of arrivals) {
      if (directionName(a) && a.direction) known.set(`${a.lineId}:${a.direction}`, directionName(a));
    }
    return a => directionName(a) || known.get(`${a.lineId}:${a.direction}`) || a.platformName || 'Trains';
  }

  function destinationOf({ towards, destinationName }) {
    const unknown = !towards || /check front/i.test(towards);
    const name = unknown ? (destinationName || '').replace(' Underground Station', '') : towards;
    return name.replace(/\s*\(.*?\)/, '') || 'Check front of train';
  }

  function departuresFrom(station, now) {
    const arrivals = state.arrivals[station.id] || [];
    const directionOf = directionFinder(arrivals);
    return arrivals
      // Trains ending here aren't departures, and TfL often lists them on every
      // platform. Those that reverse reappear with a real destination once at
      // the platform.
      .filter(a => a.destinationNaptanId !== station.id)
      .map(a => {
        const number = (a.platformName || '').match(/Platform (\S+)/)?.[1];
        const directional = Boolean(directionName(a));
        return {
          line: a.lineId,
          direction: directionOf(a),
          destination: destinationOf(a),
          seconds: (Date.parse(a.expectedArrival) - now) / 1000,
          platform: directional ? number : undefined,
          sidePlatform: directional ? undefined : number,
        };
      })
      .filter(t => t.seconds * 1000 > -AT_PLATFORM_MS)
      .sort((a, b) => a.seconds - b.seconds);
  }

  function trainHTML({ line, destination, seconds, platform, sidePlatform }, sectionPlatform) {
    const [place, via] = destination.split(/ (?=via )/);
    const ownPlatform = sidePlatform || (sectionPlatform ? undefined : platform);
    const detail = ownPlatform ? `Platform ${ownPlatform}` : via;
    const minutes = Math.floor(seconds / 60);
    const time = minutes < 1
      ? '<span class="time due">Due</span>'
      : `<span class="time">${minutes}<span class="unit"> min</span></span>`;
    return `<li class="train">
      ${leaf(line)}
      <span class="dest"><span class="place">${escape(place)}</span>${detail ? `<span class="via">${escape(detail)}</span>` : ''}</span>
      ${time}
    </li>`;
  }

  function directionHTML(direction, trains, limit) {
    const shown = trains.slice(0, limit);
    const platforms = new Set(shown.map(t => t.platform).filter(Boolean));
    // Several lines can share a direction from different platforms, so the
    // heading only names one if it holds for every row.
    const platform = platforms.size === 1 ? [...platforms][0] : undefined;
    const rowSizes = ['1.45fr', ...Array(limit - 1).fill('1fr')].join(' ');
    return `<section class="direction">
      <h3><span>${escape(direction)}</span><span>${platform ? `Platform ${escape(platform)}` : ''}</span></h3>
      <ol class="trains" style="grid-template-rows:${rowSizes}">${shown.map(t => trainHTML(t, platform)).join('')}</ol>
    </section>`;
  }

  function noTrainsHTML(station) {
    const message = state.arrivals[station.id] ? 'No trains listed' : state.errors[station.id] || 'Loading…';
    return `<section class="direction">
      <h3></h3>
      <ol class="trains"><li class="empty">${message}</li></ol>
    </section>`;
  }

  function stationHTML(station, now) {
    const trains = departuresFrom(station, now);
    const rank = direction => (DIRECTIONS.indexOf(direction) + 1 || DIRECTIONS.length + 1);
    const directions = [...new Set(trains.map(t => t.direction))].sort((a, b) => rank(a) - rank(b));
    const limit = TRAINS_BY_SECTIONS[directions.length] || 1;
    const sections = directions
      .map(direction => directionHTML(direction, trains.filter(t => t.direction === direction), limit))
      .join('');
    return `<article class="station${directions.length > 2 ? ' compact' : ''}">
      <h2><span class="name">${escape(station.name || '…')}</span><span class="trim">${icon('sparkle')}${icon('bow')}</span></h2>
      ${sections || noTrainsHTML(station)}
    </article>`;
  }

  function isGood(line) {
    return line.lineStatuses.every(s => s.statusSeverity === 10);
  }

  function statusHTML(line) {
    const summary = [...new Set(line.lineStatuses.map(s => s.statusSeverityDescription))].join(', ');
    return `<li class="status${isGood(line) ? '' : ' bad'}">
      ${leaf(line.id)}
      ${escape(LINES[line.id]?.name || line.name)}: ${escape(summary)}
    </li>`;
  }

  // An interchange can have a lot of lines, so the healthy ones share a label.
  function statusesHTML() {
    const good = state.lines.filter(isGood);
    const problems = state.lines.filter(line => !isGood(line)).map(statusHTML).join('');
    return `${problems}${good.length ? `<li class="status">${good.map(l => leaf(l.id)).join('')} Good service</li>` : ''}`;
  }

  function currentAlert(now) {
    const reasons = state.lines
      .flatMap(l => l.lineStatuses.map(s => (s.reason || '').trim()))
      .filter(Boolean);
    const unique = [...new Set(reasons)];
    return unique.length ? unique[Math.floor(now / ALERT_MS) % unique.length] : '';
  }

  function metaHTML(now) {
    const times = STATIONS.map(s => state.updated[s.id] || 0);
    const oldest = Math.min(...times);
    const stale = now - oldest > STALE_MS;
    const updated = oldest ? `Updated ${clockTime(oldest, true)}` : 'Connecting…';
    $('meta').classList.toggle('stale', Boolean(oldest) && stale);
    return `${stale && oldest ? `Connection lost · ${updated}` : updated}<br>Powered by TfL Open Data`;
  }

  // Runs every second, so only touch the DOM when the output changes
  // (rebuilding it would also restart the "Due" bounce).
  function setHTML(element, html) {
    if (element.dataset.html !== html) {
      element.innerHTML = html;
      element.dataset.html = html;
    }
  }

  function render() {
    const now = Date.now();
    const alert = currentAlert(now);
    $('clock').textContent = clockTime(now);
    $('date').textContent = calendarDate(now);
    document.title = STATIONS.map(s => s.name).filter(Boolean).join(' & ') || 'Oyster & Bells';
    setHTML($('board'), STATIONS.map(s => stationHTML(s, now)).join(''));
    setHTML($('statuses'), statusesHTML());
    setHTML($('alert'), escape(alert));
    $('notice').hidden = !alert;
    setHTML($('meta'), metaHTML(now));
  }

  // Stop the tablet going to sleep. Android drops the lock whenever the page is
  // hidden, so this runs again each time it comes back.
  async function keepAwake() {
    try {
      await navigator.wakeLock?.request('screen');
    } catch (error) {
      console.warn(error);
    }
  }

  function syncFullscreenButton() {
    const installed = matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;
    $('fullscreen').hidden = installed || !document.fullscreenEnabled || Boolean(document.fullscreenElement);
  }

  function startBoard() {
    $('fullscreen').addEventListener('click', () => document.documentElement.requestFullscreen());
    document.addEventListener('fullscreenchange', syncFullscreenButton);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) return;
      keepAwake();
      refresh();
    });

    syncFullscreenButton();
    keepAwake();
    render();
    refresh();
    setInterval(render, 1000);
    setInterval(() => { if (!document.hidden) refresh(); }, POLL_MS);
  }

  // Search returns interchanges as "HUB" stops, which have no arrivals of their
  // own. The Tube stations are their children, and some have more than one.
  async function searchStations(query) {
    const { matches = [] } = await getJSON(`/StopPoint/Search?query=${encodeURIComponent(query)}&modes=tube&maxResults=4`);
    const stations = await Promise.all(matches.map(async match => {
      if (!match.id.startsWith('HUB')) return [{ id: match.id, name: stationName(match.name) }];
      const hub = await getJSON(`/StopPoint/${match.id}`);
      return hub.children
        .filter(child => child.naptanId.startsWith('940GZZLU'))
        .map(child => ({ id: child.naptanId, name: stationName(child.commonName) }));
    }));
    return stations.flat();
  }

  function stationPicker(picker, onChange) {
    const input = picker.querySelector('input');
    const results = picker.querySelector('.results');
    let timer;
    let latest = 0;

    input.addEventListener('input', () => {
      delete picker.dataset.id;
      onChange();
      clearTimeout(timer);
      const search = ++latest;
      const query = input.value.trim();
      if (query.length < 2) {
        results.innerHTML = '';
        return;
      }
      timer = setTimeout(async () => {
        let html;
        try {
          const stations = await searchStations(query);
          html = stations
            .map(s => `<li><button type="button" data-id="${escape(s.id)}">${escape(s.name)}</button></li>`)
            .join('') || '<li class="hint">No stations found</li>';
        } catch (error) {
          console.warn(error);
          html = '<li class="hint">Can’t reach TfL</li>';
        }
        if (search === latest) results.innerHTML = html;
      }, SEARCH_DELAY_MS);
    });

    results.addEventListener('click', ({ target }) => {
      if (!target.dataset.id) return;
      latest++;
      picker.dataset.id = target.dataset.id;
      input.value = target.textContent;
      results.innerHTML = '';
      onChange();
    });
  }

  function startSetup() {
    const pickers = [...document.querySelectorAll('.picker')];
    const chosen = () => pickers.map(picker => picker.dataset.id).filter(Boolean);

    document.body.classList.add('choosing');
    $('setup').hidden = false;
    pickers.forEach(picker => stationPicker(picker, () => {
      $('open-board').disabled = chosen().length < pickers.length;
    }));
    $('setup-form').addEventListener('submit', event => {
      event.preventDefault();
      location.search = `?stations=${chosen().join(',')}`;
    });
  }

  if (STATIONS.length) startBoard();
  else startSetup();
</script>
</body>
</html>
